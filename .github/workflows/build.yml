name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/verified-gmgn-style-rankings"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-package-lock
      - run: npm run build
